[project]
name = "nuham-mscheme"
version = "0.1.0"
description = "m-scheme 1-norms, nonzero counts and maximum magnitudes from J-coupled me2j/me3j files"
authors = [
    { name = "e-eight", email = "dssohampal@gmail.com" }
]
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "sympy>=1.14.0",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN"]
ignore = ["E741"]  # l is the physics symbol for orbital angular momentum

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.src]
include = ["src", "tests"]
